# Meldiq push wake-ups: ntfy, service "ntfy" of Compose project "griip-internal-messaging" (/opt/griip-internal-messaging).
# ntfy.griipbuddy.cloud → 127.0.0.1:18081 (NTFY_HOST_PORT). Phones' ntfy apps each hold one long-lived subscription; the
# Meldiq API posts empty wake-ups through this same public name. Install, check and roll back: docs/PUSH_SERVER.md.
# Host nginx site: /etc/nginx/sites-available/griip-ntfy.conf, enabled by a symlink. Certificate "griip-ntfy" (webroot).

map $http_upgrade $griip_ntfy_connection_upgrade {
    default upgrade;
    ''      close;
}

# No client address and no URL (it holds the phone's topic): only that requests arrive and how they end.
log_format griip_ntfy '$time_iso8601 $request_method $status $request_time $bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name ntfy.griipbuddy.cloud;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/griip-message-acme;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ntfy.griipbuddy.cloud;

    ssl_certificate /etc/letsencrypt/live/griip-ntfy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/griip-ntfy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Wake-ups are empty and ntfy refuses messages over 4 KB; nothing bigger belongs here.
    client_max_body_size 16k;
    access_log /var/log/nginx/griip-ntfy.access.log griip_ntfy;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        # Subscriptions are streams (JSON lines or WebSocket): pass each event on at once and keep quiet ones open.
        # ntfy sends a keepalive every 45 s, so the long timeouts only matter for a stalled phone.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $griip_ntfy_connection_upgrade;
        proxy_set_header Host $host;
        # ntfy (behind-proxy) rate-limits by the right-most address, the one added here.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
