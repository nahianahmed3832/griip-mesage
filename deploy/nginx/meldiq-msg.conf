# Meldiq — Compose project "griip-internal-messaging" (/opt/griip-internal-messaging), on its own names (2026-10-22).
# msg.meldiq.app → API + WebSocket relay (127.0.0.1:18080)
# rtc.meldiq.app → LiveKit signalling (127.0.0.1:17880). Media uses 7881/tcp + 7882/udp directly.
# The former names (msg/rtc.griipbuddy.cloud, griip-message.conf) keep serving the same backends for apps already
# installed. Uses the WebSocket map $griip_msg_connection_upgrade defined in griip-message.conf.

server {
    listen 80;
    listen [::]:80;
    server_name msg.meldiq.app rtc.meldiq.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/griip-message-acme;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name msg.meldiq.app;

    ssl_certificate /etc/letsencrypt/live/meldiq-msg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meldiq-msg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Encrypted attachments are capped at 25 MiB by the API; larger files go straight to S3.
    client_max_body_size 27m;
    access_log /var/log/nginx/meldiq-msg.access.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $griip_msg_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name rtc.meldiq.app;

    ssl_certificate /etc/letsencrypt/live/meldiq-msg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meldiq-msg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/meldiq-rtc.access.log;

    location / {
        proxy_pass http://127.0.0.1:17880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $griip_msg_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
