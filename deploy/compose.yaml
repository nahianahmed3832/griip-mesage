# Griip Message — internal beta deployment.
# Project name is fixed; every resource Compose creates is prefixed "griip-internal-messaging_".
# Run only with project-scoped commands, e.g.:
#   docker compose -p griip-internal-messaging -f /opt/griip-internal-messaging/compose.yaml ps
name: griip-internal-messaging

services:
  api:
    build:
      context: ./server
    image: griip-internal-messaging-api:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "8080"
      TRUST_PROXY: "true"
      LIVEKIT_API_URL: http://livekit:7880
    volumes:
      - api-data:/data
    ports:
      # Loopback only: the existing reverse proxy terminates TLS and forwards here.
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    depends_on:
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    entrypoint: ["/livekit-server", "--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      # Signalling (HTTP/WebSocket) on loopback for the reverse proxy (wss://).
      - "127.0.0.1:${LIVEKIT_SIGNAL_HOST_PORT:-17880}:7880"
      # Media must be reachable directly. Host port == container port so ICE candidates are correct.
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:${LIVEKIT_RTC_UDP_PORT:-7882}/udp"
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  api-data: {}
