# Meldiq (formerly Orbit / Griip Message) — internal beta deployment.
# Project name is fixed; every resource Compose creates is prefixed "griip-internal-messaging_". It keeps that name
# after the Meldiq rebrand on purpose: the API's data volume is "griip-internal-messaging_api-data", and a renamed
# project would start on new, empty volumes. Renaming is a planned, approved migration with the volume names pinned
# (docs/MELDIQ_INFRASTRUCTURE_PLAN_2026-10-19.md › Docker). Run only with project-scoped commands, e.g.:
#   docker compose -p griip-internal-messaging -f /opt/griip-internal-messaging/compose.yaml ps
name: griip-internal-messaging

services:
  api:
    build:
      context: ./server
    image: griip-internal-messaging-api:0.10.0
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "8080"
      # The client is the last address host nginx added to X-Forwarded-For: nginx reaches the container through Docker's
      # proxy from the network gateway (a private address). "true" would believe addresses clients write themselves.
      TRUST_PROXY: "loopback,uniquelocal"
      LIVEKIT_API_URL: http://livekit:7880
    volumes:
      - api-data:/data
    ports:
      # Loopback only: the existing reverse proxy terminates TLS and forwards here.
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    depends_on:
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    # A fair share of the shared 2-vCPU host, and a cap on runaway process or thread creation.
    # (pids under deploy.resources.limits: Compose refuses pids_limit next to deploy limits.)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    entrypoint: ["/livekit-server", "--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      # Signalling (HTTP/WebSocket) on loopback for the reverse proxy (wss://).
      - "127.0.0.1:${LIVEKIT_SIGNAL_HOST_PORT:-17880}:7880"
      # Media must be reachable directly. Host port == container port so ICE candidates are correct.
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:${LIVEKIT_RTC_UDP_PORT:-7882}/udp"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
          pids: 512
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Push server for the optional payload-free wake-ups (docs/BACKGROUND_DELIVERY.md, docs/PUSH_SERVER.md): phones' ntfy
  # apps subscribe here. The API doesn't use this network to reach it: it posts to the public https:// name only.
  ntfy:
    image: binwiederhier/ntfy:v2.31.1@sha256:91bb7fa607b02006c119bb4a31032923b414a713a032ecb40f0c5d6bfd5b7e40
    restart: unless-stopped
    command: ["serve"]
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    ports:
      # Loopback only: the host's reverse proxy terminates TLS for the push server's name and forwards here.
      - "127.0.0.1:${NTFY_HOST_PORT:-18081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  api-data: {}
  ntfy-cache: {}   # wake-ups held up to 12 h for phones that were offline; safe to lose
  ntfy-auth: {}    # ntfy's access database, rebuilt from server.yml at every start; safe to lose
